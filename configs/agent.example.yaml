agent:
  id: agent-prod-01
  site_id: site-a
  hostname: srv-01.prod.internal

collectors:
  linux:
    syslog: true
    journal: true
    process: true
    network: true
    filesystem: true
    services: true
    packages: true
  windows:
    eventlog: true
    process: true
    network: true
    registry: true
    filesystem: true
    services: true

buffer:
  path: /var/lib/argus/buffer
  max_size: 5GB
  encryption: true
  key_ref: vault://argus/agent/buffer

transport:
  grpc_target: argus-core.internal:443
  tls:
    min_version: "1.3"
    ca_path: /etc/argus/ca.crt
    cert_path: /etc/argus/agent.crt
    key_path: /etc/argus/agent.key
  retry:
    max_attempts: 5
    backoff: 10s
